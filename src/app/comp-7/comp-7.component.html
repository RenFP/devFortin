<h2>Conceitos de Reactive Forms</h2>

<form [formGroup]="usuarioForm" (ngSubmit)="enviarDadosForm()">
    <label for="first-name">Nome: </label>
    <input formControlName="name" type="text" name="nome" id="first-name">
    <label for="last-name">Sobrenome: </label>
    <input formControlName="sobrenome" type="text" name="sobrenome" id="last-name">
    <br>
    <br>
    <button type="submit" [disabled]="!usuarioForm.valid">Enviar Dados</button>
</form>

<hr>
